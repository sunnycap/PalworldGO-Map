
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PalworldGO Map</title>

    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script>
    // Testlocatie
    const testLocation = [5.147576, 51.686787];

    // Kaart maken
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: testLocation,
        zoom: 16
    });

    // Zoomknoppen
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // Blauwe speler-marker
    const playerMarker = new maplibregl.Marker({
        color: '#0088ff'
    })
    .setLngLat(testLocation)
    .addTo(map);

    // GPS-koppeling voor Unreal
    window.updatePlayerLocation = function(latitude, longitude) {
        const newLocation = [longitude, latitude];

        playerMarker.setLngLat(newLocation);

        map.flyTo({
            center: newLocation,
            zoom: 16,
            essential: true
        });
    };

    // Kaart verplaatsen
    window.setMapLocation = function(latitude, longitude, zoom) {
        map.flyTo({
            center: [longitude, latitude],
            zoom: zoom || 16,
            essential: true
        });
    };
</script>

</body>
</html>
